# Règles propres au projet HOLARCH (contrat règle) ; la méthode et le dépôt public viennent de ses types. Approuvées
# par l'auteur le 2026-10-07.
- id: principes
  statement: "Toute conception respecte les principes P1 à P12 (`arbre/fondations/principes.md`). En particulier, autour des runtimes, pas à leur place (P2) : avant d'écrire une brique, vérifier qu'un runtime ou un outil existant ne le fait pas déjà bien."
  why: "Les principes sont les contraintes approuvées du système ; une brique qui refait un runtime coûte sans rien apporter."
  level: reminder
  status: stable
  approved: { by: human:auteur, at: 2026-10-07, ref: "échange du 2026-10-07, avis rendu règle par règle, choix cliquables" }
  source: harvest
- id: contrats-produit
  statement: "Les contrats sont le produit (`arbre/conception/contrats/`) ; une implémentation suit son contrat, et changer un contrat est une décision, versionnée."
  why: "Une implémentation se remplace ; un contrat changé en silence casse ceux qui s'y fient."
  level: reminder
  status: stable
  approved: { by: human:auteur, at: 2026-10-07, ref: "échange du 2026-10-07, avis rendu règle par règle, choix cliquables" }
  source: harvest
- id: reprendre
  statement: "Pour reprendre, lire `arbre/log.md` (le plus récent en tête) et la section « Avancement » de la spécification de l'étape en cours (`arbre/conception/etape-*.md`) ; l'ordre des étapes est dans `docs/architecture.md` §10."
  why: "L'état courant est dans l'arbre, pas dans un résumé de conversation."
  level: reminder
  status: stable
  approved: { by: human:auteur, at: 2026-10-07, ref: "échange du 2026-10-07, avis rendu règle par règle, choix cliquables" }
  source: harvest
- id: coherence-globale
  statement: "Ce qui s'ajoute reprend les notions, le vocabulaire et les mécanismes déjà en place (une seule façon de désigner une chose, un module partagé plutôt qu'une logique recopiée, deux vues qui donnent le même chiffre). Avant de rendre la main, chercher la notion touchée dans tout le code ; corriger ou signaler."
  why: "Deux mécanismes pour la même chose divergent et donnent deux chiffres."
  replaces: [coherence-globale]
  level: reminder
  status: stable
  approved: { by: human:auteur, at: 2026-10-07, ref: "échange du 2026-10-07, avis rendu règle par règle, choix cliquables" }
  source: harvest
- id: verifier-avant-de-rendre
  statement: "Avant de rendre la main, `npm test` est vert ; quand l'interface change, le test visuel (`npm run test:visuel`) passe aussi, puis l'interface en service est relancée là où elle tourne (`systemctl --user restart holarch-interface.service`)."
  why: "Un changement non vérifié casse la session suivante ; une interface non relancée montre l'ancienne version."
  level: reminder
  status: stable
  approved: { by: human:auteur, at: 2026-10-07, ref: "décision relancer-interface approuvée telle quelle, échange du 2026-10-07" }
  source: harvest
- id: commits
  statement: "Commits — résumé impératif court, en français ; un commit, une intention."
  level: reminder
  status: stable
  approved: { by: human:auteur, at: 2026-10-07, ref: "échange du 2026-10-07, avis rendu règle par règle, choix cliquables" }
  source: harvest
